pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: pnpm exec oxlint {staged_files}
    fmt-check:
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,css,md,yml,yaml}"
      run: pnpm exec oxfmt --check {staged_files}
    typecheck:
      run: pnpm typecheck
